name: Azure Integration Test (Tier 3)
on:
  workflow_dispatch:
  push:
    paths:
      - 'internal/provisioner/azure.go'
      - 'internal/provisioner/azure_test.go'

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.repository == 'JBraunsmaJr/forge'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Run Azure Integration
        env:
          FORGE_AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          FORGE_AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
        run: |
          go test -v ./internal/provisioner/...
