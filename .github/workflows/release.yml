name: Release

on:
  push:
    tags:
      - "v*.*.*"   # triggers on version tags like v1.2.3
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (defaults to 'dev')"
        required: false
        default: dev

permissions:
  contents: read
  packages: write   # required to push to ghcr.io

jobs:

  publish:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tags
        id: tags
        run: |
          REPO="ghcr.io/${{ github.repository_owner }}/forge"
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"

          if [ "${{ github.event_name }}" = "push" ]; then

            VERSION="${{ github.ref_name }}"
            echo "tags=${REPO}:${VERSION},${REPO}:latest,${REPO}:sha-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          else

            TAG="${{ github.event.inputs.tag }}"
            echo "tags=${REPO}:${TAG},${REPO}:sha-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "version=${TAG}" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU (for multi-platform builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Forge CI/CD
            org.opencontainers.image.description=Code-first CI/CD pipeline runner
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print published tags
        run: |
          echo "Published image tags:"
          echo "${{ steps.tags.outputs.tags }}" | tr ',' '\n' | sed 's/^/  /'

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for release notes

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build release binaries
        run: |
          VERSION="${{ github.ref_name }}"
          mkdir -p dist

          for GOOS in linux darwin windows; do
            for GOARCH in amd64 arm64; do

              [ "$GOOS" = "windows" ] && [ "$GOARCH" = "arm64" ] && continue

              EXT=""
              [ "$GOOS" = "windows" ] && EXT=".exe"

              OUTPUT="dist/forge-${VERSION}-${GOOS}-${GOARCH}${EXT}"
              echo "Building $OUTPUT..."
              GOOS=$GOOS GOARCH=$GOARCH CGO_ENABLED=0 \
                go build -ldflags="-s -w -X main.version=${VERSION}" \
                -o "$OUTPUT" ./cmd/forge
            done
          done

          ls -lh dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "Forge ${{ github.ref_name }}"
          generate_release_notes: true
          files: dist/*
          body: |


            ```bash
            docker pull ghcr.io/${{ github.repository_owner }}/forge:${{ github.ref_name }}
            ```


            ```bash
            cp .env.example .env
            docker compose up -d
            docker compose logs -f init
            ```

            See the [documentation](docs/) for setup instructions.