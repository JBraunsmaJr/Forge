# Builds an image, pushes it under a per-run tag, and runs it in a later step.
#
# Try it against a throwaway local registry. See "type: docker_build" in
# docs/Pipeline-Reference.md for the note on plain-HTTP registries under
# Podman.
#
#   docker run -d --name registry -p 5000:5000 docker.io/library/registry:2
#   forge run examples/image-build/forge.yml
#
# Run from the repository root: `context` is relative to the workspace.
name: image-build

steps:
  - id: build-image
    type: docker_build
    timeout: 10m
    docker_build:
      registry: localhost:5000
      repository: forge-examples/hello
      context: examples/image-build
      tags:
        - "test-${{ env.FORGE_BUILD_NUMBER }}"
      build_args:
        VERSION: "${{ env.FORGE_BUILD_NUMBER }}"

  # Runs the image that build-image just pushed. On another agent this would
  # pull it from the registry first.
  - id: smoke-test
    image: "localhost:5000/forge-examples/hello:test-${{ env.FORGE_BUILD_NUMBER }}"
    depends_on: [build-image]
    timeout: 2m
    run: cat /version
