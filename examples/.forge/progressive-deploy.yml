# examples/.forge/progressive-deploy.yml
#
# Progressive deployment: build once, deploy to staging → smoke test → production.
#
# The traditional CI/CD problem: separating CI and CD is painful.
# - In GitHub Actions: separate workflow files, `workflow_dispatch` events,
#   environment protection rules, complex `needs:` graphs across files.
# - Reusable workflows exist but have severe limitations (no dynamic outputs,
#   limited artifact passing, complex syntax).
#
# The Forge approach: pipeline chaining.
# A step of `type: pipeline` compiles and submits another pipeline as a child run.
# The parent waits (or doesn't), receives artifacts, and continues.
# Deploy logic lives in one place (.forge/deploy.yml) and is called from anywhere.
#
# What this demonstrates:
#   1. Build artifact uploaded to artifact store
#   2. Staging deploy (child pipeline) downloads the artifact, deploys, returns URL
#   3. Smoke tests run against staging using the URL from child pipeline
#   4. Production deploy (child pipeline) uses the SAME artifact
#   5. Policy engine automatically injects security scanning (container-security policy)
#
# This is fundamentally different from GitHub Actions' reusable workflows:
#   - The child pipeline has access to the full Forge feature set (generators, debug, etc.)
#   - Artifacts flow bidirectionally between parent and child
#   - Variables are injected as env vars — no complex input/output declarations

name: progressive-deploy

steps:

  # ── Build ────────────────────────────────────────────────────────────────────
  - id: build
    image: golang:1.24-alpine
    timeout: 15m
    env:
      CGO_ENABLED: "0"
      GOOS: linux
      GOARCH: amd64
    run: |
      echo "Building application..."
      go build -ldflags="-s -w -X main.version=${GIT_SHA:-dev}" -o dist/app ./cmd/app
      echo "Build size: $(du -sh dist/app)"
    artifacts:
      upload:
        - path: dist/app
          name: app-binary

  # ── Security scan (injected by policy engine, invisible to pipeline author) ───
  # The container-security policy automatically adds a Trivy scan here.
  # Pipeline authors don't write this — the org policy injects it.

  # ── Container build ───────────────────────────────────────────────────────────
  - id: containerize
    image: docker:24-cli
    docker_socket: true
    depends_on: [build]
    timeout: 10m
    artifacts:
      download:
        - name: app-binary
          dest: dist/app
    run: |
      chmod +x dist/app
      docker build -t "myapp:${GIT_SHA:-dev}" .
      docker save "myapp:${GIT_SHA:-dev}" | gzip > dist/myapp-image.tar.gz
      echo "Image size: $(du -sh dist/myapp-image.tar.gz)"
    artifacts:
      upload:
        - path: dist/myapp-image.tar.gz
          name: container-image

  # ── Deploy to staging (child pipeline) ───────────────────────────────────────
  # This is where pipeline chaining shines: the deploy logic lives in one file
  # (.forge/deploy.yml) and is reused for every environment. No copy-paste.
  # Variables inject the environment-specific config.
  - id: deploy-staging
    type: pipeline
    pipeline: .forge/deploy.yml     # child pipeline file in this repo
    wait: true                      # block until staging deploy completes
    depends_on: [containerize]
    variables:
      ENVIRONMENT: staging
      NAMESPACE: myapp-staging
      REPLICAS: "2"
      GIT_SHA: "${GIT_SHA:-dev}"
    # Pass the container image to the deploy pipeline.
    artifacts_send:
      - container-image
    # Receive the deployed endpoint URL for smoke tests.
    artifacts_receive:
      - deployed-endpoint

  # ── Smoke tests against staging ───────────────────────────────────────────────
  - id: smoke-tests
    image: python:3.12-slim
    depends_on: [deploy-staging]
    timeout: 10m
    artifacts:
      download:
        - name: deployed-endpoint
          dest: /tmp/endpoint.txt
    run: |
      pip install --quiet httpx pytest

      ENDPOINT=$(cat /tmp/endpoint.txt)
      echo "Running smoke tests against: $ENDPOINT"

      python3 - <<'PYEOF'
      import httpx, sys, os

      base = open("/tmp/endpoint.txt").read().strip()

      checks = [
          ("health check",    f"{base}/health",    200),
          ("readiness probe", f"{base}/ready",     200),
          ("metrics endpoint",f"{base}/metrics",   200),
          ("api version",     f"{base}/api/v1/",   200),
      ]

      failed = []
      for name, url, expected_status in checks:
          resp = httpx.get(url, timeout=10)
          if resp.status_code != expected_status:
              failed.append(f"{name}: expected {expected_status}, got {resp.status_code}")
              print(f"  ✗ {name}: {resp.status_code}", file=sys.stderr)
          else:
              print(f"  ✓ {name}: {resp.status_code}")

      if failed:
          print(f"\n{len(failed)} smoke test(s) failed:", file=sys.stderr)
          for f in failed:
              print(f"  - {f}", file=sys.stderr)
          sys.exit(1)

      print(f"\nAll {len(checks)} smoke tests passed.")
      PYEOF

  # ── Deploy to production (same child pipeline, different variables) ───────────
  # Same .forge/deploy.yml, different config. This is the key benefit: one
  # deploy pipeline tested and maintained, used everywhere.
  - id: deploy-production
    type: pipeline
    pipeline: .forge/deploy.yml
    wait: true
    depends_on: [smoke-tests]
    variables:
      ENVIRONMENT: production
      NAMESPACE: myapp-production
      REPLICAS: "10"
      GIT_SHA: "${GIT_SHA:-dev}"
    artifacts_send:
      - container-image
    artifacts_receive:
      - deployed-endpoint

  # ── Post-deploy verification ───────────────────────────────────────────────────
  - id: verify-production
    image: curlimages/curl:latest
    depends_on: [deploy-production]
    timeout: 5m
    artifacts:
      download:
        - name: deployed-endpoint
          dest: /tmp/prod-endpoint.txt
    run: |
      ENDPOINT=$(cat /tmp/prod-endpoint.txt)
      echo "Verifying production deploy at: $ENDPOINT"
      curl -sf "$ENDPOINT/health" || { echo "Production health check failed!"; exit 1; }
      echo "✓ Production deploy verified"