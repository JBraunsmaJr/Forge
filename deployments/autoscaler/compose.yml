# Forge Autoscaler — cloud provisioner deployment
#
# Runs forge-autoscaler against a real cloud provisioner (Azure VM Scale
# Sets) rather than the local Docker-based fake used by the root
# compose.yml dev stack. This service only talks to the Forge scheduler's
# HTTP API and the Azure Resource Manager API, so unlike the dev
# `docker-fake` setup it does NOT mount the Docker socket.
#
# Usage:
#   cp .env.example .env
#   docker compose up -d
#
# Image:
#   This assumes a forge-autoscaler image has been built and pushed to a
#   registry reachable from this host (see the root Dockerfile at
#   deployments/autoscaler/Dockerfile). Override the image via
#   FORGE_AUTOSCALER_IMAGE, or build+push it yourself, e.g.:
#     docker build -f deployments/autoscaler/Dockerfile -t your-registry/forge-autoscaler:latest .
#     docker push your-registry/forge-autoscaler:latest
services:
  autoscaler:
    image: ${FORGE_AUTOSCALER_IMAGE:-ghcr.io/jbraunsmajr/forge/forge-autoscaler:latest}
    environment:
      # --- Scheduler connection ---
      FORGE_SCHEDULER_URL: ${FORGE_SCHEDULER_URL:-http://localhost:8080}
      FORGE_API_TOKEN: ${FORGE_AGENT_TOKEN}

      # --- Pool sizing & timing ---
      FORGE_AUTOSCALER_HOT_POOL_SIZE: ${FORGE_AUTOSCALER_HOT_POOL_SIZE:-1}
      FORGE_AUTOSCALER_MAX_BURST_SIZE: ${FORGE_AUTOSCALER_MAX_BURST_SIZE:-10}
      FORGE_AUTOSCALER_IDLE_TIMEOUT: ${FORGE_AUTOSCALER_IDLE_TIMEOUT:-5m}
      FORGE_AUTOSCALER_POLL_INTERVAL: ${FORGE_AUTOSCALER_POLL_INTERVAL:-10s}
      FORGE_AUTOSCALER_SCALE_UP_DELAY: ${FORGE_AUTOSCALER_SCALE_UP_DELAY:-1m}
      FORGE_AUTOSCALER_METRICS_PORT: "9091"

      # --- Cloud provisioner (Azure VM Scale Sets) ---
      FORGE_AUTOSCALER_PROVIDER: azure
      FORGE_AZURE_SUBSCRIPTION_ID: ${FORGE_AZURE_SUBSCRIPTION_ID}
      FORGE_AZURE_RESOURCE_GROUP: ${FORGE_AZURE_RESOURCE_GROUP}
      FORGE_AZURE_HOT_VMSS: ${FORGE_AZURE_HOT_VMSS}
      FORGE_AZURE_BURST_VMSS: ${FORGE_AZURE_BURST_VMSS}

      # --- Azure service principal (read by the Azure SDK's default
      #     credential chain -- do not rename these) ---
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
    ports:
      # Prometheus scrape target for autoscaler metrics.
      - "${FORGE_AUTOSCALER_METRICS_PORT:-9091}:9091"
    restart: unless-stopped
    networks:
      - forge_autoscaler

networks:
  forge_autoscaler:
    name: forge_autoscaler
    driver: bridge
