services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-forge}
      POSTGRES_USER: ${POSTGRES_USER:-forge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forge}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=${POSTGRES_PASSWORD:-forge} psql -h localhost -U ${POSTGRES_USER:-forge} -d ${POSTGRES_DB:-forge} -c 'SELECT 1' -q 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - forge

  vault:
    image: hashicorp/vault:latest
    command: server
    environment:
      VAULT_LOCAL_CONFIG: |
        storage "file" {
          path = "/vault/file"
        }
        listener "tcp" {
          address     = "0.0.0.0:8200"
          tls_disable = 1
        }
        ui = true
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - vault_data:/vault/file
    restart: unless-stopped
    networks:
      - forge

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9091"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-forgeadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - forge

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set forge http://minio:9000 ${MINIO_ROOT_USER:-forgeadmin} ${MINIO_ROOT_PASSWORD} &&
        mc mb forge/forge-artifacts --ignore-existing &&
        echo 'forge-artifacts bucket ready'
      "
    networks:
      - forge

  scheduler:
    image: ghcr.io/jbraunsmajr/forge/forge:latest
    command: ["scheduler"]
    environment:
      FORGE_DB_URL: postgres://${POSTGRES_USER:-forge}:${POSTGRES_PASSWORD:-forge}@postgres:5432/${POSTGRES_DB:-forge}?sslmode=disable
      FORGE_ROOT_TOKEN: ${FORGE_ROOT_TOKEN}
      FORGE_API_TOKEN: ${FORGE_AGENT_TOKEN}
      FORGE_VAULT_ADDR: http://vault:8200
      FORGE_VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN}
      FORGE_BASE_URL: ${FORGE_BASE_URL:-http://localhost:8080}
      FORGE_ARTIFACT_STORE: s3
      FORGE_S3_ENDPOINT: http://minio:9000
      FORGE_S3_BUCKET: forge-artifacts
      FORGE_S3_REGION: us-east-1
      FORGE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-forgeadmin}
      FORGE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      FORGE_S3_PUBLIC_URL: ${FORGE_S3_PUBLIC_URL:-http://localhost:9000}
    ports:
      - "8080:8080"
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/metrics"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - forge

volumes:
  postgres_data:
  minio_data:
  vault_data:

networks:
  forge:
    driver: bridge
