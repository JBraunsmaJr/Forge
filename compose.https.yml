















services:

  # Caddy reverse proxy.
  caddy:
    build:
      context:    caddy
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [forge]
    ports:
      - "80:80"     # HTTP → HTTPS redirect
      - "443:443"   # HTTPS — forward this port on your router
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # stores issued certificates — do not delete
      - caddy_config:/config
    environment:
      FORGE_DOMAIN:  ${FORGE_DOMAIN:?FORGE_DOMAIN must be set, e.g. myforge.duckdns.org}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:?DUCKDNS_TOKEN must be set from duckdns.org}
      ACME_EMAIL:    ${ACME_EMAIL:?ACME_EMAIL must be set for Let's Encrypt}
    depends_on:
      - scheduler
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout:  10s
      retries:  3


  duckdns-updater:
    image: lscr.io/linuxserver/duckdns:latest
    environment:
      SUBDOMAINS: ${DUCKDNS_SUBDOMAIN:?DUCKDNS_SUBDOMAIN must be set}
      TOKEN:      ${DUCKDNS_TOKEN}
      LOG_FILE:   "false"
    restart: unless-stopped
    networks: [forge]

  scheduler:
    environment:
      FORGE_BASE_URL: https://${FORGE_DOMAIN}



    ports: !reset
      - "127.0.0.1:8080:8080"   # local-only — external traffic goes through Caddy







volumes:
  caddy_data:    # TLS certificates and ACME account — persist this
  caddy_config: