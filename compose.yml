services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9091"
    environment:
      MINIO_ROOT_USER: forgeadmin
      MINIO_ROOT_PASSWORD: forgepassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://localhost:9000/minio/health/live" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [ forge ]

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set forge http://minio:9000 forgeadmin forgepassword &&
        mc mb forge/forge-artifacts --ignore-existing &&
        echo 'forge-artifacts bucket ready'
      "
    restart: "no"
    networks: [ forge ]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: forge
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "PGPASSWORD=forge psql -h localhost -U forge -d forge -c 'SELECT 1' -q 2>/dev/null || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [ forge ]

  vault:
    image: hashicorp/vault:latest
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: forge-dev-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8200/v1/sys/health" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks: [ forge ]

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/jbraunsmajr/forge/forge:latest
    command: [ "scheduler" ]
    environment:
      FORGE_DB_URL: postgres://forge:forge@postgres:5432/forge?sslmode=disable
      FORGE_ROOT_TOKEN: ${FORGE_ROOT_TOKEN:-forge-dev-admin-token}
      FORGE_API_TOKEN: ${FORGE_AGENT_TOKEN:-forge-dev-agent-token}
      FORGE_GIT_CACHE: /var/lib/forge/git-cache
      FORGE_CACHE_DIR: ${FORGE_CACHE_DIR:-/var/lib/forge/cache}
      FORGE_INTERNAL_URL: http://scheduler:8080
      FORGE_UI_DEV_URL: ${FORGE_UI_DEV_URL:-http://ui:5173}
      FORGE_VAULT_ADDR: http://vault:8200
      FORGE_VAULT_TOKEN: forge-dev-token
      FORGE_BASE_URL: http://localhost:8080
      FORGE_ARTIFACT_STORE: s3
      FORGE_S3_ENDPOINT: http://minio:9000
      FORGE_S3_BUCKET: forge-artifacts
      FORGE_S3_REGION: us-east-1
      FORGE_S3_ACCESS_KEY: forgeadmin
      FORGE_S3_SECRET_KEY: forgepassword
      #FORGE_S3_PUBLIC_URL: ${FORGE_S3_PUBLIC_URL:-http://localhost:9000}
      FORGE_RUN_RETENTION: ${FORGE_RUN_RETENTION:-30d}
      FORGE_RUN_RETENTION_INTERVAL: ${FORGE_RUN_RETENTION_INTERVAL:-24h}
      FORGE_LOG_RETENTION_DAYS: ${FORGE_LOG_RETENTION_DAYS:-30}
      FORGE_GITHUB_CLIENT_ID: ${FORGE_GITHUB_CLIENT_ID}
      FORGE_GITHUB_CLIENT_SECRET: ${FORGE_GITHUB_CLIENT_SECRET}
      FORGE_PUBLIC_URL: ${FORGE_PUBLIC_URL:-http://localhost:8080}
      FORGE_UI_URL: ${FORGE_UI_URL:-http://localhost:8080}
    ports:
      - "8080:8080"
      - "50051:50051"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - git_cache:/var/lib/forge/git-cache
      - cache_data:/var/lib/forge/cache
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://localhost:8080/metrics" ]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 60s   # time for postgres wait + migrations before failures count
    restart: unless-stopped
    networks: [ forge ]

  ui:
    image: node:20-alpine
    working_dir: /ui
    volumes:
      - ./ui:/ui
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://scheduler:8080
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    networks: [ forge ]
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/jbraunsmajr/forge/forge:latest
    command: [ "agent", "${FORGE_SCHEDULER_URL:-http://scheduler:8080}" ]
    environment:
      FORGE_API_TOKEN: ${FORGE_AGENT_TOKEN:-forge-dev-agent-token}
      FORGE_VAULT_ADDR: http://vault:8200
      FORGE_VAULT_TOKEN: forge-dev-token
      FORGE_DOCKER_NETWORK: ${COMPOSE_PROJECT_NAME:-forge}_forge
      # ── Docker image cleanup ───────────────────────────────────────────────
      # Agents prune the host Docker daemon on a schedule to prevent disk fill.
      # FORGE_PRUNE_SCHEDULE  — how often to run 'docker system prune -f'.
      #   Values: @daily (default) | @hourly | any Go duration e.g. 6h
      # FORGE_DOCKER_MAX_GB   — prune immediately if Docker usage exceeds this
      #   (default 50 GB; 0 = disabled)
      # FORGE_DOCKER_MAX_PERCENT — prune immediately if disk usage exceeds this
      #   percentage (default 80; 0 = disabled)
      FORGE_PRUNE_SCHEDULE: ${FORGE_PRUNE_SCHEDULE:-@daily}
      FORGE_DOCKER_MAX_GB: ${FORGE_DOCKER_MAX_GB:-50}
      FORGE_DOCKER_MAX_PERCENT: ${FORGE_DOCKER_MAX_PERCENT:-80}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /tmp
    depends_on:
      scheduler:
        condition: service_started   # entrypoint waits for scheduler TCP, not healthcheck
      vault:
        condition: service_started
    restart: unless-stopped
    networks: [ forge ]

  init:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: [ "/bin/bash" ]
    command: [ "/scripts/init.sh" ]
    environment:
      FORGE_API_TOKEN: ${FORGE_ROOT_TOKEN:-forge-dev-admin-token}
      FORGE_VAULT_ADDR: http://vault:8200
      FORGE_VAULT_TOKEN: forge-dev-token
      SCHEDULER_URL: http://scheduler:8080
    volumes:
      - ./scripts:/scripts:ro
    depends_on:
      scheduler:
        condition: service_healthy
    restart: "no"
    networks: [ forge ]

volumes:
  postgres_data:
  git_cache:
  cache_data:
  minio_data:

networks:
  forge:
    driver: bridge