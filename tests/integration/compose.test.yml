x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  scheduler:
    image: "${FORGE_IMAGE}"
    command: ["scheduler"]
    logging: *default-logging
    labels:
      forge.managed: "true"
      forge.agent_id: "${FORGE_PROXY_AGENT_ID}"
    environment:
      FORGE_ROOT_TOKEN: it-admin-token-forge
      FORGE_RUN_RETENTION_DAYS: "1"
      FORGE_ARTIFACT_STORE: local
      FORGE_ARTIFACT_DIR: /data/artifacts
      FORGE_VAULT_ADDR: http://vault:8200
      FORGE_VAULT_TOKEN: forge-dev-token
      FORGE_UI_DEV_URL: ""
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_started
      vault:
        condition: service_started

  agent:
    image: "${FORGE_IMAGE}"
    command: ["agent", "http://scheduler:8080"]
    logging: *default-logging
    labels:
      forge.managed: "true"
      forge.agent_id: "${FORGE_PROXY_AGENT_ID}"
    environment:
      FORGE_API_TOKEN: it-admin-token-forge
      FORGE_DOCKER_NETWORK: "${COMPOSE_PROJECT_NAME}_forge"
      FORGE_PROXY_AGENT_ID: "${FORGE_PROXY_AGENT_ID}"
      FORGE_PROXY_URL: http://proxy:9090
      FORGE_SCHEDULER_URL: http://scheduler:8080
    volumes:
      - forge_sockets:/run/forge-sockets
    depends_on:
      scheduler:
        condition: service_started
      proxy:
        condition: service_started
    deploy:
      replicas: 2   # two agents so cancel test occupying one doesn't block rerun test

  postgres:
    logging: *default-logging
    labels:
      forge.managed: "true"
      forge.agent_id: "${FORGE_PROXY_AGENT_ID}"

  vault:
    logging: *default-logging
    labels:
      forge.managed: "true"
      forge.agent_id: "${FORGE_PROXY_AGENT_ID}"

  minio:
    logging: *default-logging
    labels:
      forge.managed: "true"
      forge.agent_id: "${FORGE_PROXY_AGENT_ID}"

  proxy:
    image: "${FORGE_IMAGE}"
    command: ["proxy"]
    logging: *default-logging
    labels:
      forge.managed: "true"
      forge.agent_id: "${FORGE_PROXY_AGENT_ID}"
    environment:
      FORGE_AGENT_ID: "${FORGE_AGENT_ID}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - forge_sockets:/run/forge-sockets

  minio-init:
    logging: *default-logging
    labels:
      forge.managed: "true"
      forge.agent_id: "${FORGE_PROXY_AGENT_ID}"

  autoscaler:
    # This is a genuinely different binary from scheduler/agent/proxy/init
    # (cmd/forge-autoscaler, not a subcommand of the main forge CLI — see
    # deployments/autoscaler/Dockerfile). It was previously pointed at
    # ${FORGE_IMAGE} like the others below, which meant it ran the main
    # forge binary with no matching subcommand — Cobra's response to that
    # is to print its help/usage text and exit, which looked like a
    # config error but was really just the wrong image entirely.
    build:
      context: .
      dockerfile: deployments/autoscaler/Dockerfile
    logging: *default-logging
    labels:
      forge.managed: "true"
      forge.agent_id: "${FORGE_PROXY_AGENT_ID}"
    environment:
      FORGE_PROXY_AGENT_ID: "${FORGE_PROXY_AGENT_ID}"
      FORGE_SCHEDULER_URL: http://scheduler:8080
      FORGE_API_TOKEN: it-admin-token-forge
      # Correct as-is: this is what the autoscaler tells spawned agents
      # to run, and agents do correctly use the main forge binary's
      # "agent" subcommand.
      FORGE_AUTOSCALER_DOCKER_IMAGE: "${FORGE_IMAGE}"
      FORGE_AUTOSCALER_DOCKER_NETWORK: "${COMPOSE_PROJECT_NAME}_forge"
      FORGE_PROXY_URL: http://proxy:9090
      FORGE_AUTOSCALER_DOCKER_SOCKETS_VOLUME: "${COMPOSE_PROJECT_NAME}_forge_sockets"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      scheduler:
        condition: service_started

  init:
    image: "${FORGE_IMAGE}"
    entrypoint: ["/bin/bash"]
    command: ["/scripts/init.sh"]
    logging: *default-logging
    labels:
      forge.managed: "true"
      forge.agent_id: "${FORGE_PROXY_AGENT_ID}"
    environment:
      FORGE_API_TOKEN: it-admin-token-forge
      FORGE_VAULT_ADDR: http://vault:8200
      FORGE_VAULT_TOKEN: forge-dev-token
      SCHEDULER_URL: http://scheduler:8080
    volumes: []
    depends_on:
      scheduler:
        condition: service_started

  ui:
    labels:
      forge.managed: "true"
      forge.agent_id: "${FORGE_PROXY_AGENT_ID}"
    volumes: []
    profiles:
      - disabled

volumes:
  postgres_data:
    labels:
      forge.managed: "true"
      forge.agent_id: "${FORGE_PROXY_AGENT_ID}"
  git_cache:
    labels:
      forge.managed: "true"
      forge.agent_id: "${FORGE_PROXY_AGENT_ID}"
  cache_data:
    labels:
      forge.managed: "true"
      forge.agent_id: "${FORGE_PROXY_AGENT_ID}"
  minio_data:
    labels:
      forge.managed: "true"
      forge.agent_id: "${FORGE_PROXY_AGENT_ID}"
  forge_sockets:
    labels:
      forge.managed: "true"
      forge.agent_id: "${FORGE_PROXY_AGENT_ID}"

networks:
  forge:
    labels:
      forge.managed: "true"
      forge.agent_id: "${FORGE_PROXY_AGENT_ID}"