services:
  scheduler:
    image: "${FORGE_IMAGE}"
    labels:
      forge.managed: "true"
      forge.agent_id: "${FORGE_AGENT_ID}"
    environment:
      FORGE_ROOT_TOKEN: it-admin-token-forge
      FORGE_RUN_RETENTION_DAYS: "1"
      FORGE_ARTIFACT_STORE: local
      FORGE_ARTIFACT_DIR: /data/artifacts
      FORGE_VAULT_ADDR: http://vault:8200
      FORGE_VAULT_TOKEN: forge-dev-token
      FORGE_UI_DEV_URL: ""

  agent:
    image: "${FORGE_IMAGE}"
    labels:
      forge.managed: "true"
      forge.agent_id: "${FORGE_AGENT_ID}"
    environment:
      FORGE_API_TOKEN: it-admin-token-forge
      FORGE_DOCKER_NETWORK: "${COMPOSE_PROJECT_NAME}_forge"
      FORGE_PROXY_AGENT_ID: "${FORGE_AGENT_ID}"
    deploy:
      replicas: 2   # two agents so cancel test occupying one doesn't block rerun test

  postgres:
    labels:
      forge.managed: "true"
      forge.agent_id: "${FORGE_AGENT_ID}"

  vault:
    labels:
      forge.managed: "true"
      forge.agent_id: "${FORGE_AGENT_ID}"

  minio:
    labels:
      forge.managed: "true"
      forge.agent_id: "${FORGE_AGENT_ID}"

  proxy:
    image: "${FORGE_IMAGE}"
    labels:
      forge.managed: "true"
      forge.agent_id: "${FORGE_AGENT_ID}"

  minio-init:
    labels:
      forge.managed: "true"
      forge.agent_id: "${FORGE_AGENT_ID}"

  init:
    image: "${FORGE_IMAGE}"
    labels:
      forge.managed: "true"
      forge.agent_id: "${FORGE_AGENT_ID}"
    volumes: []

  ui:
    labels:
      forge.managed: "true"
      forge.agent_id: "${FORGE_AGENT_ID}"
    volumes: []
    profiles:
      - disabled

volumes:
  postgres_data:
    labels:
      forge.managed: "true"
      forge.agent_id: "${FORGE_AGENT_ID}"
  git_cache:
    labels:
      forge.managed: "true"
      forge.agent_id: "${FORGE_AGENT_ID}"
  cache_data:
    labels:
      forge.managed: "true"
      forge.agent_id: "${FORGE_AGENT_ID}"
  minio_data:
    labels:
      forge.managed: "true"
      forge.agent_id: "${FORGE_AGENT_ID}"
  forge_sockets:
    labels:
      forge.managed: "true"
      forge.agent_id: "${FORGE_AGENT_ID}"

networks:
  forge:
    labels:
      forge.managed: "true"
      forge.agent_id: "${FORGE_AGENT_ID}"