name: Forge Main

steps:

  - id: build-policies
    uses: ./templates/docker-build.yml
    inputs:
      - examples/policies/**
    with:
      timeout: 5m
      image: ghcr.io/jbraunsmajr/forge/forge-security-policies
      dockerfile: examples/policies/Dockerfile
      context: examples/policies/

  - id: build-image
    uses: ./templates/docker-build.yml
    with:
      timeout: 10m
      image: ghcr.io/jbraunsmajr/forge/forge
      dockerfile: Dockerfile
      context: .

  - id: release-approval
    name: Approve Release
    type: approval
    condition: tag()

  - id: build-binaries
    name: Build Binaries
    image: golang:1.26.5-alpine
    depends_on: [ release-approval ]
    matrix:
      os: [ linux, windows, darwin ]
      arch: [ amd64, arm64 ]
    env:
      CGO_ENABLED: "0"
    run: |
      # Debug: check if artifact was downloaded
      ls -la
      mkdir -p internal/scheduler/web
      tar -xzf ui-dist.tar.gz -C internal/scheduler/web
      export GOOS=${{ matrix.os }}
      export GOARCH=${{ matrix.arch }}
      EXT=""
      if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
      OUT="forge-${GOOS}-${GOARCH}${EXT}"
      mkdir -p dist
      go build -ldflags="-s -w" -o "dist/${OUT}" ./cmd/forge
    artifacts:
      download:
        - name: ui-dist.tar.gz
      upload:
        - path: dist/forge-*
          name: forge-${{ matrix.os }}-${{ matrix.arch }}

  - id: github-release
    name: GitHub Release
    type: release
    depends_on: [ build-binaries ]
    condition: tag()
    release:
      name: "Release ${{ env.FORGE_COMMIT_TAG }}"
      tag: "${{ env.FORGE_COMMIT_TAG }}"
      body: |
        Forge Release ${{ env.FORGE_COMMIT_TAG }}

        Automated release of Forge binaries.
      artifacts:
        - forge-*