name: Forge Main

steps:

  - id: build-policies
    name: Build Policies
    image: docker:27-cli
    timeout: 5m
    secrets: [ GITHUB_TOKEN, GITHUB_USER ]
    inputs:
      - examples/policies/**
    run: |
      echo "$GITHUB_TOKEN" | docker login ghcr.io -u $GITHUB_USER --password-stdin
      docker build -t ghcr.io/jbraunsmajr/forge/forge-security-policies examples/policies/
      docker push ghcr.io/jbraunsmajr/forge/forge-security-policies
    docker_socket: true

  - id: build-image
    name: Build Image
    image: docker:27-cli
    docker_socket: true
    depends_on: [ unit-tests ]
    secrets: [ GITHUB_TOKEN, GITHUB_USER ]
    timeout: 10m
    run: |
      echo "$GITHUB_TOKEN" | docker login ghcr.io -u $GITHUB_USER --password-stdin
      docker build -t ghcr.io/jbraunsmajr/forge/forge -f Dockerfile .
      docker push ghcr.io/jbraunsmajr/forge/forge

  - id: release-approval
    name: Approve Release
    type: approval
    depends_on: [ unit-tests ]
    condition: tag()

  - id: build-binaries
    name: Build Binaries
    image: golang:1.26.5-alpine
    depends_on: [ release-approval ]
    matrix:
      os: [ linux, windows, darwin ]
      arch: [ amd64, arm64 ]
    env:
      CGO_ENABLED: "0"
    run: |
      # Debug: check if artifact was downloaded
      ls -la
      mkdir -p internal/scheduler/web
      tar -xzf ui-dist.tar.gz -C internal/scheduler/web
      export GOOS=${{ matrix.os }}
      export GOARCH=${{ matrix.arch }}
      EXT=""
      if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
      OUT="forge-${GOOS}-${GOARCH}${EXT}"
      mkdir -p dist
      go build -ldflags="-s -w" -o "dist/${OUT}" ./cmd/forge
    artifacts:
      download:
        - name: ui-dist.tar.gz
      upload:
        - path: dist/forge-*
          name: forge-${{ matrix.os }}-${{ matrix.arch }}

  - id: github-release
    name: GitHub Release
    type: release
    depends_on: [ build-binaries ]
    condition: tag()
    release:
      name: "Release ${{ env.FORGE_COMMIT_TAG }}"
      tag: "${{ env.FORGE_COMMIT_TAG }}"
      body: |
        Forge Release ${{ env.FORGE_COMMIT_TAG }}

        Automated release of Forge binaries.
      artifacts:
        - forge-*