name: Forge-Testing

steps:

  - id: verify-examples
    type: pipeline
    pipeline: .forge/examples.yml

  - id: build-ui
    name: Build UI
    image: node:22-alpine
    timeout: 5m
    inputs:
      - ui/**
      - package.json
      - package-lock.json
    run: |
      cd ui
      npm install
      npm run build
      cd ..
      # Verify build output exists
      ls -la internal/scheduler/web/dist
      tar -czf ui-dist.tar.gz -C internal/scheduler/web dist
    artifacts:
      upload:
        - path: ui-dist.tar.gz

  - id: build-image
    name: Build Image
    uses: ./templates/docker-build.yml
    depends_on: [ build-ui ]
    timeout: 10m
    with:
      image: ghcr.io/jbraunsmajr/forge/forge:test-${{ env.FORGE_BUILD_NUMBER }}
      dockerfile: Dockerfile
      context: .

  - id: unit-tests
    name: Unit Tests
    image: golang:1.26.5-alpine
    docker_socket: true
    depends_on: [ build-image ]
    env:
      FORGE_IMAGE: ghcr.io/jbraunsmajr/forge/forge:test-${{ env.FORGE_BUILD_NUMBER }}
    artifacts:
      download:
        - name: ui-dist.tar.gz
    timeout: 10m
    script: .forge/scripts/unit-tests.sh

  - id: integration-tests
    name: Integration Tests
    image: golang:1.26.5-alpine
    docker_socket: true
    depends_on: [ build-image ]
    env:
      FORGE_IMAGE: ghcr.io/jbraunsmajr/forge/forge:test-${{ env.FORGE_BUILD_NUMBER }}
    artifacts:
      download:
        - name: ui-dist.tar.gz
    timeout: 10m
    split:
      strategy: duration
      shards: 3
      history_days: 14
      min_history_runs: 2
      fallback: single
    test_report: .forge/test-report.json
    script: .forge/scripts/integration-tests.sh

  - id: promote-on-branch
    name: Promote Image
    condition: "!branch(main)"
    type: docker_publish
    depends_on: [ unit-tests, integration-tests ]
    secrets: [ REGISTRY_USERNAME, REGISTRY_PASSWORD ]
    docker_publish:
      registry: ghcr.io
      repository: jbraunsmajr/forge/forge
      source: test-${{ env.FORGE_BUILD_NUMBER }}
      tags:
        - ${{ env.FORGE_BRANCH }}
      delete_source: true

  - id: main-pipeline
    condition: branch(main)
    type: pipeline
    pipeline: .forge/main.yml
    depends_on: [ unit-tests, integration-tests ]
    artifacts_send: [ui-dist.tar.gz]