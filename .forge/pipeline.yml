name: Forge-CI-CD

steps:
  - id: build-ui
    name: Build UI
    image: node:22-alpine
    timeout: 5m
    run: |
      cd ui
      npm install
      npm run build
      cd ..
      # Verify build output exists
      ls -la internal/scheduler/web/dist
      tar -czf ui-dist.tar.gz -C internal/scheduler/web dist
    artifacts:
      upload:
        - path: ui-dist.tar.gz

  - id: unit-tests
    name: Unit Tests
    image: golang:1.26.5-alpine
    depends_on: [build-ui]
    artifacts:
      download:
        - name: ui-dist.tar.gz
    timeout: 5m
    run: |
      # Debug: check if artifact was downloaded
      ls -la
      mkdir -p internal/scheduler/web
      tar -xzf ui-dist.tar.gz -C internal/scheduler/web
      # Debug: verify extraction
      ls -la internal/scheduler/web/dist
      go test ./...

  - id: build-image
    name: Build Image
    image: docker:27-cli
    docker_socket: true
    depends_on: [unit-tests]
    secrets: [GITHUB_TOKEN, GITHUB_USER]
    timeout: 10m
    run: |
      echo "$GITHUB_TOKEN" | docker login ghcr.io -u $GITHUB_USER --password-stdin
      docker build -t ghcr.io/jbraunsmajr/forge/forge -f Dockerfile .
      docker push ghcr.io/jbraunsmajr/forge/forge

  - id: release-approval
    name: Approve Release
    type: approval
    depends_on: [build-image]
    condition: tag()

  - id: build-binaries
    name: Build Binaries
    image: golang:1.26.5-alpine
    depends_on: [unit-tests, build-ui]
    matrix:
      os: [linux, windows, darwin]
      arch: [amd64, arm64]
    env:
      CGO_ENABLED: "0"
    run: |
      # Debug: check if artifact was downloaded
      ls -la
      mkdir -p internal/scheduler/web
      tar -xzf ui-dist.tar.gz -C internal/scheduler/web
      export GOOS=${{ matrix.os }}
      export GOARCH=${{ matrix.arch }}
      EXT=""
      if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
      OUT="forge-${GOOS}-${GOARCH}${EXT}"
      mkdir -p dist
      go build -ldflags="-s -w" -o "dist/${OUT}" ./cmd/forge
    artifacts:
      download:
        - name: ui-dist.tar.gz
      upload:
        - path: dist/forge-*
          name: forge-${{ matrix.os }}-${{ matrix.arch }}

  - id: github-release
    name: GitHub Release
    type: release
    depends_on: [release-approval]
    condition: tag()
    release:
      name: "Release ${{ env.FORGE_COMMIT_TAG }}"
      tag: "${{ env.FORGE_COMMIT_TAG }}"
      body: "Forge Release ${{ env.FORGE_COMMIT_TAG }}\n\nAutomated release of Forge binaries."
      artifacts:
        - forge-linux-amd64
        - forge-linux-arm64
        - forge-windows-amd64
        - forge-windows-arm64
        - forge-darwin-amd64
        - forge-darwin-arm64
      
      
