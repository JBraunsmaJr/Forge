name: Forge-Testing

steps:

  - id: verify-examples
    type: pipeline
    pipeline: .forge/examples.yml

  - id: build-ui
    name: Build UI
    image: node:22-alpine
    timeout: 5m
    inputs:
      - ui/**
      - package.json
      - package-lock.json
    run: |
      cd ui
      npm install
      npm run build
      cd ..
      # Verify build output exists
      ls -la internal/scheduler/web/dist
      tar -czf ui-dist.tar.gz -C internal/scheduler/web dist
    artifacts:
      upload:
        - path: ui-dist.tar.gz

  - id: unit-tests
    name: Unit Tests
    image: golang:1.26.5-alpine
    docker_socket: true
    depends_on: [ build-ui ]
    artifacts:
      download:
        - name: ui-dist.tar.gz
    timeout: 10m
    run: |
      apk add --no-cache docker-cli docker-cli-compose iproute2
      # Debug: check if artifact was downloaded
      ls -la
      mkdir -p internal/scheduler/web
      tar -xzf ui-dist.tar.gz -C internal/scheduler/web
      # Debug: verify extraction
      ls -la internal/scheduler/web/dist
      INTEGRATION_SKIP=1 go test -v ./...

  - id: integration-tests
    name: Integration Tests
    image: golang:1.26.5-alpine
    docker_socket: true
    depends_on: [ build-ui ]
    artifacts:
      download:
        - name: ui-dist.tar.gz
    timeout: 10m
    run: |
      apk add --no-cache docker-cli docker-cli-compose iproute2
      # Debug: check if artifact was downloaded
      ls -la
      mkdir -p internal/scheduler/web
      tar -xzf ui-dist.tar.gz -C internal/scheduler/web
      # Debug: verify extraction
      ls -la internal/scheduler/web/dist
      go test -v ./tests/integration/...    

  - id: main-pipeline
    condition: branch(main)
    type: pipeline
    pipeline: .forge/main.yml
    depends_on: [ unit-tests, integration-tests ]
    artifacts_send: [ui-dist.tar.gz]